name: temporary Psion DC dedupe

on:
  push:
    branches:
      - feat-psion-exact-int-dc

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-psion-exact-int-dc
      - name: Remove duplicate exact-DC blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('psion/guiscripts/Psionics.py')
          text = p.read_text()
          block = '''# BG-family GemRB games use MaximumAbility=25. Public Psion SPLs are authored
          # for the class minimum INT 15 (+2); save-bearing internal clones cover every
          # other reachable modifier without changing known-spell or PP state.
          DC_BASELINE_MODIFIER = 2
          DC_MODIFIER_SUFFIXES = {
              -5: "V", -4: "W", -3: "X", -2: "Y", -1: "Z",
              0: "0", 1: "1", 3: "3", 4: "4", 5: "5", 6: "6", 7: "7",
          }
          DC_SUFFIX_MODIFIERS = {suffix: modifier for modifier, suffix in DC_MODIFIER_SUFFIXES.items()}

          '''
          if text.count(block) != 2:
              raise SystemExit(f'unexpected Psion DC constant block count: {text.count(block)}')
          text = text.replace(block + block, block, 1)

          helper_start = text.index('def _dc_modifier(actor):\n')
          power_start = text.index('def power_info(resref):\n', helper_start)
          helpers = text[helper_start:power_start]
          half = len(helpers) // 2
          if len(helpers) % 2 or helpers[:half] != helpers[half:]:
              raise SystemExit('exact-DC helper duplication is not an exact double')
          text = text[:helper_start] + helpers[:half] + text[power_start:]

          prep_start = text.index('def _memorized_parent_entry(spellbook, actor, parent):\n')
          req_start = text.index('def _meets_base_requirements(actor, info):\n', prep_start)
          prep = text[prep_start:req_start]
          half = len(prep) // 2
          if len(prep) % 2 or prep[:half] != prep[half:]:
              raise SystemExit('prepare-action duplication is not an exact double')
          text = text[:prep_start] + prep[:half] + text[req_start:]
          p.write_text(text)

          p = Path('psion/tests/validate_runtime.py')
          text = p.read_text()
          triples = '''    gemrb_vars = {}
              prepared_casts = []
              dc_resources = {"PS1MTHR4", "PSMT034"}
          '''
          if text.count(triples) != 2:
              raise SystemExit(f'unexpected runtime state block count: {text.count(triples)}')
          text = text.replace(triples + triples, triples, 1)

          fake = '''    gemrb.GetSpell = lambda resref, *_: ({"SpellResRef": str(resref).upper()} if str(resref).upper() in dc_resources else None)
              gemrb.SetVar = lambda name, value: gemrb_vars.__setitem__(name, value)

              def prepare_spontaneous(actor, source, book_type, level, replacement):
                  prepared_casts.append((actor, str(source).upper(), book_type, level, str(replacement).upper()))
                  return 17

              gemrb.PrepareSpontaneousCast = prepare_spontaneous
          '''
          if text.count(fake) != 2:
              raise SystemExit(f'unexpected fake GemRB DC hook block count: {text.count(fake)}')
          text = text.replace(fake + fake, fake, 1)

          start = text.index('        assert module._dc_modifier(1) == 4\n')
          end = text.index('        real_begin_manifest = module.begin_manifest\n', start)
          checks = text[start:end]
          half = len(checks) // 2
          if len(checks) % 2 or checks[:half] != checks[half:]:
              raise SystemExit('runtime DC checks are not an exact double')
          text = text[:start] + checks[:half] + text[end:]
          p.write_text(text)
          PY
      - name: Validate deduplicated files
        run: |
          python -m py_compile psion/guiscripts/Psionics.py psion/tests/validate_runtime.py
          python psion/tests/validate_runtime.py
      - name: Commit dedupe
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add psion/guiscripts/Psionics.py psion/tests/validate_runtime.py
          git commit -m 'Deduplicate Psion exact-DC runtime patch'
          git push
