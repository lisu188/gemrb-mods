name: temporary Psion stale item-test fix

on:
  push:
    branches:
      - feat-psion-exact-int-dc

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Update Psion shared item-restriction expectations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-psion-exact-int-dc
      - name: Patch stale assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('psion/tests/validate_class_progression.py')
          text = path.read_text()
          text = text.replace(
              '    spell_helpers = (COMMON / "weidu" / "spell-functions.tpa").read_text(encoding="utf-8")\n',
              '    spell_helpers = (COMMON / "weidu" / "spell-functions.tpa").read_text(encoding="utf-8")\n    item_helper = (COMMON / "weidu" / "class-item-usability.tpa").read_text(encoding="utf-8")\n',
              1,
          )
          text = text.replace(
              '        "DEFINE_PATCH_FUNCTION PSION_ADD_CLASS_RESTRICTION",\n',
              '',
              1,
          )
          text = text.replace(
              '        "ps_has_restriction = 0",\n',
              '        "ps_item_restrict_psion = 0",\n',
              1,
          )
          text = text.replace(
              '        assert f"LPF PSION_ADD_CLASS_RESTRICTION INT_VAR class_id = {variable} END" in item_usability\n',
              '        assert f"LPF GEMRB_ADD_CLASS_ITEM_RESTRICTION INT_VAR class_id = {variable} END" in item_usability\n',
              1,
          )
          marker = '    assert "ITM V1" in spell_helpers\n'
          addition = '''    assert "ITM V1" in spell_helpers\n    for fragment in (\n        "DEFINE_PATCH_FUNCTION GEMRB_ADD_CLASS_ITEM_RESTRICTION",\n        "LPF ADD_ITEM_EQEFFECT",\n        "opcode = 319",\n        "parameter2 = 5",\n    ):\n        assert fragment in item_helper, fragment\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, addition, 1)
          path.write_text(text)
          PY
      - name: Commit test update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add psion/tests/validate_class_progression.py
          git commit -m 'Update Psion shared item-restriction expectations'
          git push
