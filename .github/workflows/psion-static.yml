name: Psion static checks

on:
  pull_request:
    paths:
      - "psion/**"
      - ".github/workflows/psion-static.yml"
  push:
    paths:
      - "psion/**"
      - ".github/workflows/psion-static.yml"

env:
  WEIDU_VERSION: "251.00"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python psion/tests/validate.py
      - run: python psion/tests/validate_runtime.py
      - run: python psion/tests/validate_patcher.py
      - run: python psion/tests/validate_level3.py
      - run: python psion/tests/validate_level4.py
      - run: python psion/tests/validate_level5.py
      - name: Install official WeiDU release
        shell: bash
        run: |
          set -euo pipefail
          release="$(curl --fail --silent --show-error --location \
            "https://api.github.com/repos/WeiDUorg/weidu/releases/tags/v${WEIDU_VERSION}")"
          asset_url="$(jq -r '
            [.assets[]
              | select(.name | test("linux"; "i"))
              | select(.name | test("source|src"; "i") | not)
              | .browser_download_url][0] // empty
          ' <<<"$release")"
          if [[ -z "$asset_url" ]]; then
            jq -r '.assets[].name' <<<"$release" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location "$asset_url" --output /tmp/weidu.zip
          archive_dir="$RUNNER_TEMP/weidu-archive"
          bin_dir="$RUNNER_TEMP/weidu-bin"
          mkdir -p "$archive_dir" "$bin_dir"
          unzip -q /tmp/weidu.zip -d "$archive_dir"
          executable="$(find "$archive_dir" -type f -iname weidu -print -quit)"
          test -n "$executable"
          cp "$executable" "$bin_dir/weidu"
          chmod +x "$bin_dir/weidu"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Parse complete WeiDU installer
        run: bash psion/tests/validate_weidu.sh
