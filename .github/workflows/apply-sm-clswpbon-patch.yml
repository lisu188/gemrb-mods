name: Apply Sorcerer Monk CLSWPBON patch

on:
  push:
    branches:
      - fix/sorcerer-monk-clswpbon-preserve-comments
    paths:
      - .github/workflows/apply-sm-clswpbon-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sorcerer-monk-clswpbon-preserve-comments
      - name: Patch installer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sorcerer-monk/setup-sorcerer-monk.tp2')
          text = path.read_text(encoding='utf-8')
          old = '''// CLSWPBON controls proficiency APR, unarmed APR, and the zero-proficiency
          // THAC0 penalty. Sorcerer/Monk deliberately follows Monk combat behavior, so
          // copy a single valid live Monk row instead of freezing the stock 1/3/2 values.
          ACTION_IF FILE_EXISTS_IN_GAME ~clswpbon.2da~ THEN BEGIN
            COPY_EXISTING ~clswpbon.2da~ ~override~
              // GemRB's shared table documents its columns with trailing hash-comment
              // lines. WeiDU's 2DA helpers count those words as an extra-wide row, so
              // remove comment-only lines before validating the live table.
              REPLACE_TEXTUALLY ~%MNL%~ ~~
              REPLACE_TEXTUALLY ~^[ %TAB%]*#.*$~ ~~
              COUNT_2DA_COLS sm_clswpbon_cols
              PATCH_IF sm_clswpbon_cols = 4 BEGIN
                READ_2DA_ENTRIES_NOW ~sm_clswpbon~ sm_clswpbon_cols
                FOR (sm_i = 0; sm_i < sm_clswpbon; ++sm_i) BEGIN
                  READ_2DA_ENTRY_FORMER ~sm_clswpbon~ sm_i 0 sm_clswpbon_class
                  PATCH_IF (~%sm_clswpbon_class%~ STRING_EQUAL_CASE ~MONK~) BEGIN
                    READ_2DA_ENTRY_FORMER ~sm_clswpbon~ sm_i 1 sm_clswpbon_apr
                    READ_2DA_ENTRY_FORMER ~sm_clswpbon~ sm_i 2 sm_clswpbon_unarmed
                    READ_2DA_ENTRY_FORMER ~sm_clswpbon~ sm_i 3 sm_clswpbon_thac0
                    PATCH_IF (IS_AN_INT ~%sm_clswpbon_apr%~)
                        AND (IS_AN_INT ~%sm_clswpbon_unarmed%~)
                        AND (IS_AN_INT ~%sm_clswpbon_thac0%~)
                        AND (sm_clswpbon_apr >= 0)
                        AND (sm_clswpbon_unarmed >= 0)
                        AND (sm_clswpbon_thac0 >= 0) BEGIN
                      SET sm_monk_clswpbon_matches += 1
                      SPRINT sm_clswpbon_row ~%sm_clswpbon_apr% %sm_clswpbon_unarmed% %sm_clswpbon_thac0%~
                    END
                  END
                END
              END
            BUT_ONLY

            ACTION_IF (sm_clswpbon_cols != 4) OR (sm_monk_clswpbon_matches > 1) THEN BEGIN
              FAIL @28
            END
          END
          '''
          new = '''// CLSWPBON controls proficiency APR, unarmed APR, and the zero-proficiency
          // THAC0 penalty. Sorcerer/Monk deliberately follows Monk combat behavior, so
          // copy a single valid live Monk row instead of freezing the stock 1/3/2 values.
          ACTION_IF FILE_EXISTS_IN_GAME ~clswpbon.2da~ THEN BEGIN
            COPY_EXISTING ~clswpbon.2da~ ~override~
              // GemRB's shared table ends with human-readable hash comments. Do not use
              // COUNT_2DA_COLS here: it can mistake those comment words for table cells.
              // Validate the real header directly, then read the four logical columns.
              // This keeps the source resource byte-for-byte intact except for the new
              // Sorcerer/Monk row appended later in the component.
              SET sm_clswpbon_cols = 0
              PATCH_IF INDEX_BUFFER (~^[ %TAB%]*GETS_PROF_APR[ %TAB%]+UNARMED_DIVISOR[ %TAB%]+ZERO_SKILL_THAC0[ %TAB%]*$~) >= 0 BEGIN
                SET sm_clswpbon_cols = 4
                READ_2DA_ENTRIES_NOW ~sm_clswpbon~ 4
                FOR (sm_i = 0; sm_i < sm_clswpbon; ++sm_i) BEGIN
                  READ_2DA_ENTRY_FORMER ~sm_clswpbon~ sm_i 0 sm_clswpbon_class
                  PATCH_IF (~%sm_clswpbon_class%~ STRING_EQUAL_CASE ~MONK~) BEGIN
                    READ_2DA_ENTRY_FORMER ~sm_clswpbon~ sm_i 1 sm_clswpbon_apr
                    READ_2DA_ENTRY_FORMER ~sm_clswpbon~ sm_i 2 sm_clswpbon_unarmed
                    READ_2DA_ENTRY_FORMER ~sm_clswpbon~ sm_i 3 sm_clswpbon_thac0
                    PATCH_IF (IS_AN_INT ~%sm_clswpbon_apr%~)
                        AND (IS_AN_INT ~%sm_clswpbon_unarmed%~)
                        AND (IS_AN_INT ~%sm_clswpbon_thac0%~)
                        AND (sm_clswpbon_apr >= 0)
                        AND (sm_clswpbon_unarmed >= 0)
                        AND (sm_clswpbon_thac0 >= 0) BEGIN
                      SET sm_monk_clswpbon_matches += 1
                      SPRINT sm_clswpbon_row ~%sm_clswpbon_apr% %sm_clswpbon_unarmed% %sm_clswpbon_thac0%~
                    END
                  END
                END
              END
            BUT_ONLY

            ACTION_IF (sm_clswpbon_cols != 4) OR (sm_monk_clswpbon_matches > 1) THEN BEGIN
              FAIL @28
            END
          END
          '''
          if old not in text:
              raise SystemExit('expected CLSWPBON block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorcerer-monk/setup-sorcerer-monk.tp2
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Preserve CLSWPBON comments while reading Monk combat data"
          git push origin HEAD:fix/sorcerer-monk-clswpbon-preserve-comments
