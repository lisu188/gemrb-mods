name: Sorcerer Monk preflight ordering
on:
  push:
    branches: [derive-sm-sorcerer-spell-metadata]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: derive-sm-sorcerer-spell-metadata
      - run: python .github/patches/sm_preflight_order.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'sorcerer-monk: preserve identity guard ordering'
          git push
