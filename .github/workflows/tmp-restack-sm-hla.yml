name: temporary Sorcerer Monk HLA restack

on:
  push:
    branches:
      - fix/sorcerer-monk-hla-ambiguity-v2

permissions:
  contents: write

jobs:
  restack:
    if: github.event.head_commit.message != 'Restack Sorcerer Monk HLA ambiguity guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sorcerer-monk-hla-ambiguity-v2
          fetch-depth: 0
      - name: Copy reviewed HLA changes onto current master
        run: |
          git fetch origin fix/sorcerer-monk-hla-ambiguity
          for path in \
            sorcerer-monk/lib/source-row-preflight.tpa \
            sorcerer-monk/tests/weidu_hla_guard_smoke.py \
            sorcerer-monk/tra/english.tra; do
            git show origin/fix/sorcerer-monk-hla-ambiguity:$path > $path
          done
      - name: Commit restacked change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sorcerer-monk/lib/source-row-preflight.tpa sorcerer-monk/tests/weidu_hla_guard_smoke.py sorcerer-monk/tra/english.tra
          git commit -m 'Restack Sorcerer Monk HLA ambiguity guard'
          git push
