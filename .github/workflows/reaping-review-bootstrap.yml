name: Reaping Knives review validation

on:
  push:
    branches:
      - fix/reaping-owner-identity
    paths:
      - .review-reaping.py
      - .review-reaping-extra.py
      - .github/workflows/reaping-review-bootstrap.yml

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, 'Fix Reaping Knives owner identity')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded source changes
        run: |
          python .review-reaping.py
          python .review-reaping-extra.py
      - name: Validate ownership and existing runtime
        run: |
          set -euo pipefail
          python cipher/tests/validate_reaping_knives_runtime.py
          python cipher/tests/validate.py
          python common/tests/validate.py
          python common/tests/validate_review_regressions.py
      - uses: actions/checkout@v4
        with:
          repository: gemrb/gemrb
          ref: 8c853a764ab489eee7e990a713eeb24dc8cc2d53
          path: vendor/gemrb
      - name: Verify pinned synchronous state APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('vendor/gemrb/gemrb/plugins/GUIScript/GUIScript.cpp').read_text()
          start = source.index('static PyObject* GemRB_SetGlobal(')
          body = source[start:source.index('Py_RETURN_NONE;', start)]
          assert 'SetVariable(Sender, StringParam(Variable), Value, context)' in body
          assert 'ExecuteString' not in body
          effects = Path('vendor/gemrb/gemrb/plugins/FXOpcodes/FXOpcodes.cpp').read_text()
          assert 'Protection:Spell' in effects
          assert 'STAT_SET(IE_SCRIPTINGSTATE1 + fx->Parameter2, fx->Parameter1)' in effects
          print('Pinned synchronous GLOBAL setter and serialized owner-state contracts passed')
          PY
      - name: Publish validated source patch
        run: |
          set -euo pipefail
          git add cipher/guiscripts/Cipher.py cipher/lib/reaping-knives-focus.tpa cipher/tests/validate_reaping_knives_runtime.py cipher/tests/verify_high_tier_weidu.py cipher/README.md
          git rm .review-reaping.py .review-reaping-extra.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix Reaping Knives owner identity across party changes and save reload'
          git push origin "HEAD:${GITHUB_REF_NAME}"
