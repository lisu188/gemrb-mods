name: Reaping Knives review validation

on:
  push:
    branches:
      - fix/reaping-owner-identity
    paths:
      - .review-reaping.py
      - .github/workflows/reaping-review-bootstrap.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gemrb/gemrb
          ref: 8c853a764ab489eee7e990a713eeb24dc8cc2d53
          path: vendor/gemrb
      - name: Inspect engine state contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('vendor/gemrb/gemrb')
          text = (root / 'plugins/GUIScript/GUIScript.cpp').read_text()
          for symbol in re.findall(r'static PyObject\* (GemRB_\w+)\(', text):
              if any(word in symbol for word in ('Global', 'Var', 'ActorID', 'PlayerID')):
                  index = text.find('static PyObject* ' + symbol + '(')
                  print('\nAPI', symbol, '\n', text[index:index + 1900])
          text = (root / 'plugins/FXOpcodes/FXOpcodes.cpp').read_text()
          for symbol in ('int fx_scripting_state(', 'int fx_modify_local_variable(', 'int fx_local_variable('):
              index = text.rfind(symbol)
              print('\nEFFECT', symbol, 'offset', index)
              if index >= 0:
                  print(text[index:index + 2200])
          PY
