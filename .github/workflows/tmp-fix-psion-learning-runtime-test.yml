name: temporary Psion learning runtime test fix

on:
  push:
    branches:
      - feat-psion-selectable-powers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-psion-selectable-powers
      - name: Fix regression block indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('psion/tests/validate_runtime.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('        stats[(1, 34)] = 1\n    assert module.power_learning_limits')
          end = text.index('        assert module.skill_points_remaining(1) == 24', start)
          block = text[start:end]
          lines = block.splitlines()
          fixed = [lines[0]] + [('        ' + line[4:]) if line.startswith('    ') else line for line in lines[1:]]
          path.write_text(text[:start] + '\n'.join(fixed) + '\n' + text[end:], encoding='utf-8')
          PY
          rm .github/workflows/tmp-fix-psion-learning-runtime-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix selectable-power runtime regression indentation'
          git push origin HEAD:feat-psion-selectable-powers
