name: Cipher static validation

on:
  push:
    paths:
      - 'cipher/**'
      - '.github/workflows/cipher-static.yml'
  pull_request:
    paths:
      - 'cipher/**'
      - '.github/workflows/cipher-static.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python cipher/tests/validate.py
