name: Cipher validation

on:
  push:
    paths:
      - 'cipher/**'
      - 'psion/lib/spell-functions.tpa'
      - 'psion/tests/make_weidu_fixture.py'
      - 'psion/tests/seed_savewiz_fixture.py'
      - '.github/workflows/cipher-static.yml'
  pull_request:
    paths:
      - 'cipher/**'
      - 'psion/lib/spell-functions.tpa'
      - 'psion/tests/make_weidu_fixture.py'
      - 'psion/tests/seed_savewiz_fixture.py'
      - '.github/workflows/cipher-static.yml'

env:
  WEIDU_VERSION: '251.00'
  GEMRB_FIXTURE_COMMIT: '8c853a764ab489eee7e990a713eeb24dc8cc2d53'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Cipher sources and runtime
        run: python cipher/tests/validate.py
      - name: Install official WeiDU release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/weidu-archive"
          bin_dir="$RUNNER_TEMP/weidu-bin"
          mkdir -p "$archive_dir" "$bin_dir"
          gh release download "v${WEIDU_VERSION}" \
            --repo WeiDUorg/weidu \
            --pattern '*Linux*' \
            --dir "$RUNNER_TEMP"
          archive="$(find "$RUNNER_TEMP" -maxdepth 1 -type f -iname '*linux*' -print -quit)"
          test -n "$archive"
          unzip -q "$archive" -d "$archive_dir"
          executable="$(find "$archive_dir" -type f -iname weidu -print -quit)"
          test -n "$executable"
          cp "$executable" "$bin_dir/weidu"
          chmod +x "$bin_dir/weidu"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Parse complete WeiDU installer
        run: bash cipher/tests/validate_weidu.sh
      - name: Check out pinned GemRB fixture data
        uses: actions/checkout@v4
        with:
          repository: gemrb/gemrb
          ref: ${{ env.GEMRB_FIXTURE_COMMIT }}
          path: vendor/gemrb
          fetch-depth: 1
      - name: Seed missing Mage saving throw fixture
        run: python psion/tests/seed_savewiz_fixture.py vendor/gemrb
      - name: Install, uninstall and reinstall every class-table layout
        shell: bash
        run: |
          set -euo pipefail
          for layout in normalized native legacy; do
            echo "Validating Cipher $layout layout"
            bash cipher/tests/validate_weidu_install.sh vendor/gemrb "$layout"
          done
