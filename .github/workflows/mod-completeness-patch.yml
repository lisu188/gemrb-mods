name: Mod completeness patch

on:
  push:
    branches:
      - agent/review-mod-completeness
    paths:
      - .github/workflows/mod-completeness-patch.yml
      - tools/apply_mod_completeness_patch.py
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/mod-completeness-patch.yml
      - tools/apply_mod_completeness_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-mod-completeness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed completeness fixes
        run: python tools/apply_mod_completeness_patch.py
      - name: Run fast validation
        run: |
          python common/tests/validate_class_registration.py
          python psion/tests/validate.py
          python psion/tests/validate_class_progression.py
          python cipher/tests/validate.py
          python -m unittest discover -s sorcerer-monk/tests -p 'test_*.py'
          python -m compileall -q psion cipher common sorcerer-monk
          git diff --check
      - name: Commit reviewed changes and remove patch helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mod-completeness-patch.yml tools/apply_mod_completeness_patch.py
          git add psion cipher common .github/workflows
          git commit -m 'Harden Psion and Cipher class registration'
          git push origin HEAD:agent/review-mod-completeness
