name: Shared runtime refactor patch
on:
  push:
    branches: [shared-gemrb-core]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shared-gemrb-core
      - run: python .github/patches/shared_runtime_refactor.py
      - run: python -m py_compile psion/guiscripts/Psionics.py common/guiscripts/*.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Refactor Psion runtime onto shared core primitives'
          git push
