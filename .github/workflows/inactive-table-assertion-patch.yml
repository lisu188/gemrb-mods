name: Inactive table assertion patch

on:
  push:
    branches:
      - agent/review-mod-completeness
    paths:
      - tools/patch_inactive_table_assertions.py
      - .github/workflows/inactive-table-assertion-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-mod-completeness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch inactive-table assertions
        run: python tools/patch_inactive_table_assertions.py
      - name: Validate patched sources
        run: |
          python cipher/tests/validate.py
          python psion/tests/validate.py
          python -m compileall -q cipher/tests psion/tests
          git diff --check
      - name: Commit patched tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cipher/tests psion/tests
          git commit -m 'Validate only active class schema'
          git push origin HEAD:agent/review-mod-completeness
