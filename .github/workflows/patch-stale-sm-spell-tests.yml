name: Patch Stale SM Spell Tests

on:
  push:
    branches:
      - derive-sm-sorcerer-spell-metadata
    paths:
      - .github/workflows/patch-stale-sm-spell-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: derive-sm-sorcerer-spell-metadata
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh only stale MXSPLSRC assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('sorcerer-monk/tests').glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              out = []
              touched = False
              for line in lines:
                  if 'assert' in line and 'MXSPLSRC' in line and '%sm_magespell%' not in line:
                      line = line.replace('MXSPLSRC', '%sm_magespell%')
                      touched = True
                  out.append(line)
              if touched:
                  path.write_text('\n'.join(out) + '\n', encoding='utf-8')
                  changed.append(str(path))
          print('updated:', *changed)
          PY
          python -m unittest discover -s sorcerer-monk/tests -p 'test_*.py'
      - name: Commit passing assertion refresh and remove helper files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-stale-sm-spell-tests.yml
          git rm -f sorcerer-monk/tests/static-failure.txt || true
          git add sorcerer-monk/tests
          git commit -m "Refresh Sorcerer spell metadata assertions"
          git push origin HEAD:derive-sm-sorcerer-spell-metadata
