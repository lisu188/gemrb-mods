name: temporary Sorcerer Monk CRLF patch

on:
  push:
    branches:
      - fix/sorcerer-monk-clswpbon-preserve-comments

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Accept CRLF CLSWPBON headers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sorcerer-monk-clswpbon-preserve-comments
      - name: Patch reviewed CRLF regression
        run: |
          python - <<'PY'
          from pathlib import Path

          tp2 = Path('sorcerer-monk/setup-sorcerer-monk.tp2')
          text = tp2.read_text()
          old = r'PATCH_IF INDEX_BUFFER (~^[ %TAB%]*GETS_PROF_APR[ %TAB%]+UNARMED_DIVISOR[ %TAB%]+ZERO_SKILL_THAC0[ %TAB%]*$~) >= 0 BEGIN'
          new = r'PATCH_IF INDEX_BUFFER (~^[ %TAB%]*GETS_PROF_APR[ %TAB%]+UNARMED_DIVISOR[ %TAB%]+ZERO_SKILL_THAC0[ %TAB%]*~) >= 0 BEGIN'
          assert text.count(old) == 1, 'expected CLSWPBON header validator not found exactly once'
          tp2.write_text(text.replace(old, new), newline='\n')

          smoke = Path('sorcerer-monk/tests/weidu_clswpbon_comments_smoke.py')
          text = smoke.read_text()
          old = '''    path.write_text(\n        "2DA V1.0\\n"\n        "0\\n"\n        "                        GETS_PROF_APR     UNARMED_DIVISOR   ZERO_SKILL_THAC0\\n"\n        "SORCERER                0                 0                 4\\n"\n        "MONK                    0                 5                 7\\n"\n        "\\n"\n        + COMMENTS,\n        encoding="utf-8",\n    )'''
          new = '''    text = (\n        "2DA V1.0\\n"\n        "0\\n"\n        "                        GETS_PROF_APR     UNARMED_DIVISOR   ZERO_SKILL_THAC0\\n"\n        "SORCERER                0                 0                 4\\n"\n        "MONK                    0                 5                 7\\n"\n        "\\n"\n        + COMMENTS\n    )\n    path.write_bytes(text.replace("\\n", "\\r\\n").encode("utf-8"))'''
          assert text.count(old) == 1, 'expected LF-only CLSWPBON fixture not found exactly once'
          smoke.write_text(text.replace(old, new), newline='\n')
          PY
      - name: Commit reviewed fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sorcerer-monk/setup-sorcerer-monk.tp2 sorcerer-monk/tests/weidu_clswpbon_comments_smoke.py
          git commit -m 'Accept CRLF CLSWPBON headers'
          git push
