name: Psicrystal workbench

on:
  push:
    branches: [fix/psicrystal-companion]
    paths: [.github/workflows/psicrystal-workbench.yml]

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lisu188/gemrb
          ref: 91e64d19c90f169530f99f5a08ecf96f1402cf67
          path: vendor/engine
      - uses: actions/checkout@v4
        with:
          repository: gemrb/gemrb
          ref: 8c853a764ab489eee7e990a713eeb24dc8cc2d53
          path: vendor/fixture
      - name: Collect public development inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workbench"
          git archive --format=tar HEAD > "$RUNNER_TEMP/workbench/mods.tar"
          git -C vendor/engine archive --format=tar HEAD > "$RUNNER_TEMP/workbench/engine.tar"
          git -C vendor/fixture archive --format=tar HEAD > "$RUNNER_TEMP/workbench/fixture.tar"
          gh release download v251.00 --repo WeiDUorg/weidu --pattern '*Linux*' --dir "$RUNNER_TEMP/workbench"
      - uses: actions/upload-artifact@v4
        with:
          name: psicrystal-workbench
          path: ${{ runner.temp }}/workbench/*
          retention-days: 7
