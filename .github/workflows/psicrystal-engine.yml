name: Companion engine test runtime
on:
  push:
    branches: [feat/psicrystal-companion]
    paths: [.github/workflows/psicrystal-engine.yml]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lisu188/gemrb
          ref: 91e64d19c90f169530f99f5a08ecf96f1402cf67
      - name: Build test engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libfreetype-dev libpng-dev python3-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG='-O1 -g0' -DPYTHON_VERSION=3 -DUSE_SDLMIXER=OFF -DUSE_OPENAL=OFF -DUSE_LIBVLC=OFF -DUSE_VORBIS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/runtime"
          cmake --build build -j2
          cmake --install build
      - name: Collect relocatable private test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/runtime/lib" "$RUNNER_TEMP/runtime/python/lib"
          cp -a /usr/lib/python3.12 "$RUNNER_TEMP/runtime/python/lib/"
          cp -L /usr/lib/x86_64-linux-gnu/libpython3.12.so.1.0 "$RUNNER_TEMP/runtime/lib/"
          tar -C "$RUNNER_TEMP" -czf engine-test-runtime.tar.gz runtime
      - uses: actions/upload-artifact@v4
        with:
          name: companion-engine-test-runtime
          path: engine-test-runtime.tar.gz
          retention-days: 7
