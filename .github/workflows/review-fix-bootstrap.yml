name: Review fix validation bootstrap

on:
  push:
    branches:
      - fix/review-runtime-20260905
    paths:
      - .review-apply.py
      - .github/workflows/review-fix-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded source corrections
        run: python .review-apply.py
      - name: Run fault-injection and HP regressions
        run: python common/tests/validate_review_regressions.py
      - name: Validate existing shared and Psion contracts
        run: |
          set -euo pipefail
          python common/tests/validate.py
          python psion/tests/validate_runtime.py
          python psion/tests/validate.py
          python psion/tests/validate_patcher.py
      - name: Commit only the validated patch and remove bootstrap files
        run: |
          set -euo pipefail
          git add common/guiscripts/GemRBModCore.py common/tools/install_guiscripts.py psion/guiscripts/Psionics.py psion/lib/mind-vigor-augment.tpa .github/workflows/class-registration.yml
          git rm .review-apply.py .github/workflows/review-fix-bootstrap.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix fail-open casting, installed hook upgrades and duplicate Psion HP grants'
          git push origin "HEAD:${GITHUB_REF_NAME}"
