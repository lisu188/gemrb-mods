name: temporary Psion selectable powers implementation

on:
  push:
    branches:
      - feat-psion-selectable-powers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-psion-selectable-powers
      - name: Implement power learning
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          psion = root / 'psion'

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Stable one-to-one selector proxies for every catalogue power.
          power_lines = (psion / 'tables/psionpowers.2da').read_text(encoding='utf-8').splitlines()
          powers = [line.split()[0] for line in power_lines[3:] if line.strip() and not line.lstrip().startswith(('#', '//'))]
          pick = ['2DA V1.0', '****', '        ResRef   Type']
          for index, power in enumerate(powers, 1):
              pick.append(f'{power:<8} PXL{index:04d} 3')
          (psion / 'tables/pspick.2da').write_text('\n'.join(pick) + '\n', encoding='utf-8')

          # Power acquisition is now runtime-selected rather than fixed in CLAB.
          clab_names = ('clabpsee.2da','clabpsha.2da','clabpkin.2da','clabpego.2da','clabpnom.2da','clabptel.2da')
          for name in clab_names:
              lines = ['2DA V1.0', '****', '        ABILITY1   ABILITY2   ABILITY3   ABILITY4   ABILITY5 ABILITY6']
              lines.append('1       GA_PXPLRN  GA_PXCNTR  GA_PXFSEL  GA_PXSKILL ****     ****')
              for level in range(2, 21):
                  lines.append(f'{level:<7} ****        ****        ****        ****        ****     ****')
              (psion / 'tables' / name).write_text('\n'.join(lines) + '\n', encoding='utf-8')

          setup = psion / 'setup-psion.tp2'
          replace_once(setup, 'VERSION ~1.2.0~', 'VERSION ~1.3.0~')
          replace_once(setup,
              'COPY ~psion/tables/psfsel.2da~ ~override/psfsel.2da~\n',
              'COPY ~psion/tables/psfsel.2da~ ~override/psfsel.2da~\nCOPY ~psion/tables/pspick.2da~ ~override/pspick.2da~\n')
          replace_once(setup,
              'INCLUDE ~psion/lib/powers.tpa~\n\n// The power resources are authored against the guaranteed INT 15 minimum.',
              'INCLUDE ~psion/lib/powers.tpa~\n\n// Selector choices use harmless proxy SPLs so choosing a power to learn never\n// manifests the real power for free. The proxies retain the real SPL UI metadata.\nAT_NOW ~python3 "psion/tools/generate_learning_proxies.py" --override "override" --output ".psion-learn-build"~\nCOPY ~.psion-learn-build~ ~override~\nAT_NOW ~python3 "psion/tools/generate_learning_proxies.py" --output ".psion-learn-build" --cleanup~\n\n// The power resources are authored against the guaranteed INT 15 minimum.')

          focus = psion / 'lib/focus-feats.tpa'
          marker = '''COPY_EXISTING ~PXFSEL.spl~ ~override~
            LPF ADD_SPELL_EFFECT INT_VAR opcode = 214 target = 1 timing = 1 STR_VAR resource = ~PSFSEL~ END
          BUT_ONLY
          '''
          addition = marker + '''
          // Powers-known credits are derived from PSIONKNOWN.2DA. The selector is
          // reusable while a legal unlearned power remains; PXL* choices are harmless
          // proxies that Psionics.py commits into real known powers.
          LAF psion_create_focus_action
            STR_VAR
              ps_resref = ~PXPLRN~
              ps_name = ~Learn Psion Power~
              ps_description = ~Choose one Psion power to learn. Available choices respect your powers-known total, maximum power level, and discipline. Selecting a choice learns it permanently but does not manifest it or spend power points.~
              ps_icon = ~spwi112~
          END
          COPY_EXISTING ~PXPLRN.spl~ ~override~
            LPF ADD_SPELL_EFFECT INT_VAR opcode = 214 target = 1 timing = 1 STR_VAR resource = ~PSPICK~ END
          BUT_ONLY
          '''
          replace_once(focus, marker, addition)

          runtime = psion / 'guiscripts/Psionics.py'
          replace_once(runtime,
              'FEAT_SELECTOR_RESOURCE = "PXFSEL"\nSKILL_SELECTOR_RESOURCE = "PXSKILL"\n',
              'FEAT_SELECTOR_RESOURCE = "PXFSEL"\nPOWER_SELECTOR_RESOURCE = "PXPLRN"\nSKILL_SELECTOR_RESOURCE = "PXSKILL"\n')
          replace_once(runtime,
              '''def _skill_pick_table():
              try:
                  return GemRB.LoadTable("psskill", False, True)
              except Exception:
                  return None
          ''',
              '''def _skill_pick_table():
              try:
                  return GemRB.LoadTable("psskill", False, True)
              except Exception:
                  return None
          
          
          def _power_pick_table():
              try:
                  return GemRB.LoadTable("pspick", False, True)
              except Exception:
                  return None
          
          
          def _known_power_table():
              try:
                  return GemRB.LoadTable("psionknown", False, True)
              except Exception:
                  return None
          ''')
          replace_once(runtime,
              '\ndef feat_rank(actor, resref):\n',
              '''
          def power_choice_info(resref):
              key = (resref or "").upper()
              if not key.startswith("PXL"):
                  return None
              table = _power_pick_table()
              if not table:
                  return None
              try:
                  for index in range(table.GetRowCount()):
                      power = str(table.GetRowName(index)).upper()
                      if str(table.GetValue(power, "ResRef")).upper() != key:
                          continue
                      base = _base_power_info(power)
                      if not base:
                          return None
                      base.update({
                          "kind": "power_choice",
                          "resref": key,
                          "parent": key,
                          "power": power,
                      })
                      return base
              except Exception:
                  return None
              return None
          
          
          def power_learning_limits(actor):
              if not is_psion(actor):
                  return (0, 0)
              table = _known_power_table()
              if not table:
                  return (0, 0)
              try:
                  level = manifester_level(actor)
                  return (
                      int(table.GetValue(str(level), "KNOWN")),
                      int(table.GetValue(str(level), "MAX_LEVEL")),
                  )
              except Exception:
                  return (0, 0)
          
          
          def known_power_refs(actor):
              known = set()
              try:
                  count = GemRB.GetKnownSpellsCount(actor, INNATE_TYPE, INNATE_LEVEL)
                  for index in range(count):
                      spell = GemRB.GetKnownSpell(actor, INNATE_TYPE, INNATE_LEVEL, index)
                      key = str(spell.get("SpellResRef", "")).upper()
                      if _base_power_info(key):
                          known.add(key)
              except Exception as error:
                  GemRB.Log(2, "Psionics", "known-power scan failed: %s" % error)
              return known
          
          
          def power_choices_remaining(actor):
              limit, _ = power_learning_limits(actor)
              return max(0, limit - len(known_power_refs(actor)))
          
          
          def can_learn_power(actor, resref):
              info = power_choice_info(resref)
              if not info or not is_psion(actor) or power_choices_remaining(actor) <= 0:
                  return False
              if info["power"] in known_power_refs(actor):
                  return False
              _, maximum_level = power_learning_limits(actor)
              if info["level"] > maximum_level:
                  return False
              return info["discipline"] in ("GENERAL", discipline(actor))
          
          
          def available_power_choices(actor):
              table = _power_pick_table()
              if not table or power_choices_remaining(actor) <= 0:
                  return []
              available = []
              try:
                  for index in range(table.GetRowCount()):
                      power = table.GetRowName(index)
                      resref = str(table.GetValue(power, "ResRef")).upper()
                      if can_learn_power(actor, resref):
                          available.append(resref)
              except Exception:
                  return []
              return available
          
          
          def _ensure_power_selector_known(actor):
              """Grant PXPLRN to migrated Psions that still have legal choices."""
              if not is_psion(actor) or not available_power_choices(actor):
                  return False
              try:
                  count = GemRB.GetKnownSpellsCount(actor, INNATE_TYPE, INNATE_LEVEL)
                  for index in range(count):
                      spell = GemRB.GetKnownSpell(actor, INNATE_TYPE, INNATE_LEVEL, index)
                      if str(spell.get("SpellResRef", "")).upper() == POWER_SELECTOR_RESOURCE:
                          return True
                  result = GemRB.LearnSpell(actor, POWER_SELECTOR_RESOURCE, LS_MEMO)
                  return result in (0, 1)
              except Exception as error:
                  GemRB.Log(2, "Psionics", "power selector migration failed: %s" % error)
                  return False
          
          
          def _learn_power(actor, resref):
              info = power_choice_info(resref)
              if not info or not can_learn_power(actor, resref):
                  return False
              try:
                  return GemRB.LearnSpell(actor, info["power"], LS_MEMO) in (0, 1)
              except Exception as error:
                  GemRB.Log(2, "Psionics", "power learning failed: %s" % error)
                  return False
          
          
          def feat_rank(actor, resref):
          ''')
          replace_once(runtime,
              '            sync_skill_points(actor)\n            _ensure_skill_selector_known(actor)\n',
              '            _ensure_power_selector_known(actor)\n            sync_skill_points(actor)\n            _ensure_skill_selector_known(actor)\n')
          replace_once(runtime,
              '''    if key == FEAT_SELECTOR_RESOURCE:
                  return {"kind": "feat_selector", "resref": key, "parent": key, "cost": 0, "selector": True}
              if key == SKILL_SELECTOR_RESOURCE:
          ''',
              '''    if key == FEAT_SELECTOR_RESOURCE:
                  return {"kind": "feat_selector", "resref": key, "parent": key, "cost": 0, "selector": True}
              if key == POWER_SELECTOR_RESOURCE:
                  return {"kind": "power_selector", "resref": key, "parent": key, "cost": 0, "selector": True}
              if key == SKILL_SELECTOR_RESOURCE:
          ''')
          replace_once(runtime,
              '''    feat = feat_choice_info(key)
              if feat:
                  return feat
          ''',
              '''    power_choice = power_choice_info(key)
              if power_choice:
                  return power_choice
              feat = feat_choice_info(key)
              if feat:
                  return feat
          ''')
          replace_once(runtime,
              '''    for resref in resrefs:
                  feat = feat_choice_info(resref)
          ''',
              '''    for resref in resrefs:
                  power_choice = power_choice_info(resref)
                  if power_choice:
                      if can_learn_power(actor, resref):
                          filtered.append(resref)
                      continue
                  feat = feat_choice_info(resref)
          ''')
          replace_once(runtime,
              '''    if key == FEAT_SELECTOR_RESOURCE:
                  return bonus_feats_remaining(actor) > 0
              if key == SKILL_SELECTOR_RESOURCE:
          ''',
              '''    if key == FEAT_SELECTOR_RESOURCE:
                  return bonus_feats_remaining(actor) > 0
              if key == POWER_SELECTOR_RESOURCE:
                  return bool(available_power_choices(actor))
              if key == SKILL_SELECTOR_RESOURCE:
          ''')
          replace_once(runtime,
              '    sync_skill_points(actor)\n    _ensure_skill_selector_known(actor)\n',
              '    _ensure_power_selector_known(actor)\n    sync_skill_points(actor)\n    _ensure_skill_selector_known(actor)\n')
          replace_once(runtime,
              '''    if info["kind"] == "feat_selector":
                  cancel_pending(actor)
                  return bool(available_feat_choices(actor))
          ''',
              '''    if info["kind"] == "power_selector":
                  cancel_pending(actor)
                  return bool(available_power_choices(actor))
          
              if info["kind"] == "power_choice":
                  key = info["resref"]
                  return _begin_simple_action(
                      actor,
                      ("POWER_LEARN", key),
                      lambda: can_learn_power(actor, key),
                      lambda: _learn_power(actor, key),
                  )
          
              if info["kind"] == "feat_selector":
                  cancel_pending(actor)
                  return bool(available_feat_choices(actor))
          ''')

          # Replace fixed-progression validator with selector-led progression checks.
          core = psion / 'tests/validate_core.py'
          text = core.read_text(encoding='utf-8')
          start = text.index('def validate_progressions() -> None:')
          end = text.index('\ndef validate_weidu_integer_syntax()', start)
          replacement = '''def validate_progressions() -> None:
              known = {int(row[0]): (int(row[1]), int(row[2])) for row in rows("psionknown.2da")}
              assert known[1] == (3, 1)
              assert known[20] == (36, 9)
              previous_known = previous_max = 0
              for level in range(1, 21):
                  current_known, current_max = known[level]
                  assert current_known >= previous_known
                  assert current_max >= previous_max
                  previous_known, previous_max = current_known, current_max
          
              for discipline, filename in DISCIPLINE_CLABS.items():
                  data = rows(filename)
                  assert len(data) == 20, (discipline, len(data))
                  level1 = next(row for row in data if row[0] == "1")
                  utilities = {token for token in level1[1:] if token != "****"}
                  assert utilities == {"GA_PXPLRN", "GA_PXCNTR", "GA_PXFSEL", "GA_PXSKILL"}, (discipline, utilities)
                  for row in data:
                      assert not any(token.startswith("GA_PS") for token in row[1:]), (discipline, row)
                      if row[0] != "1":
                          assert all(token == "****" for token in row[1:]), (discipline, row)
          
          
          def validate_learnable_powers() -> None:
              catalogue = [row[0] for row in rows("psionpowers.2da")]
              picks = rows("pspick.2da")
              assert [row[0] for row in picks] == catalogue
              assert len(picks) == len({row[1] for row in picks}) == len(catalogue) == 85
              for index, row in enumerate(picks, 1):
                  assert row == [catalogue[index - 1], f"PXL{index:04d}", "3"], row
          
          '''
          core.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          text = core.read_text(encoding='utf-8')
          text = text.replace('"psionfeats.2da": ["MIN_LEVEL", "FOCUS", "PP_SURCHARGE"],', '"psionfeats.2da": ["MIN_LEVEL", "FOCUS", "PP_SURCHARGE"],\n        "pspick.2da": ["ResRef", "Type"],')
          text = text.replace('"ps2aaff", "mxpsion", "clabpsee"', '"ps2aaff", "pspick", "mxpsion", "clabpsee"')
          core.write_text(text, encoding='utf-8')

          # Focus/selector regression checks.
          vf = psion / 'tests/validate_focus_feats.py'
          text = vf.read_text(encoding='utf-8')
          text = text.replace('assert level1.count("GA_PXCNTR") == 1, filename', 'assert level1.count("GA_PXPLRN") == 1, filename\n        assert level1.count("GA_PXCNTR") == 1, filename')
          text = text.replace('assert text.count("GA_PXCNTR") == 1, filename', 'assert text.count("GA_PXPLRN") == 1, filename\n        assert text.count("GA_PXCNTR") == 1, filename')
          text = text.replace('"PXCNTR",\n        "PXCMEDI",', '"PXCNTR",\n        "PXCMEDI",\n        "PXPLRN",')
          selector_marker = '''    selector = section(builder, "PXFSEL")
              assert "opcode = 214" in selector
              assert "resource = ~PSFSEL~" in selector
          '''
          selector_add = selector_marker + '''
              power_selector = section(builder, "PXPLRN")
              assert "opcode = 214" in power_selector
              assert "resource = ~PSPICK~" in power_selector
          '''
          if selector_marker not in text:
              raise SystemExit('focus selector marker missing')
          text = text.replace(selector_marker, selector_add, 1)
          text = text.replace('assert "psfsel.2da" in setup', 'assert "psfsel.2da" in setup\n    assert "pspick.2da" in setup')
          vf.write_text(text, encoding='utf-8')

          # Existing runtime fake needs the new tables, selector, and transaction kind.
          vr = psion / 'tests/validate_runtime.py'
          text = vr.read_text(encoding='utf-8')
          text = text.replace('"psionfeatpick",\n            "psionskills",', '"psionfeatpick",\n            "psionknown",\n            "pspick",\n            "psionskills",')
          text = text.replace('{"SpellResRef": "PXFSEL"},\n        {"SpellResRef": "PXSKILL"}', '{"SpellResRef": "PXFSEL"},\n        {"SpellResRef": "PXPLRN"},\n        {"SpellResRef": "PXSKILL"}')
          text = text.replace('{"SpellResRef": "PXFSEL", "Flags": 0},\n        {"SpellResRef": "PXSKILL", "Flags": 1}', '{"SpellResRef": "PXFSEL", "Flags": 0},\n        {"SpellResRef": "PXPLRN", "Flags": 1},\n        {"SpellResRef": "PXSKILL", "Flags": 1}')
          text = text.replace('info["kind"] in ("center", "feat_choice", "skill_choice")', 'info["kind"] in ("center", "power_choice", "feat_choice", "skill_choice")')
          insert_at = '        stats[(1, 34)] = 1\n        assert module.sync_skill_points(1) == 24\n'
          learning_test = '''        stats[(1, 34)] = 1
              assert module.power_learning_limits(1) == (3, 1)
              assert module.power_choices_remaining(1) == 1
              egoist_proxy = next(
                  resref for resref in module.available_power_choices(1)
                  if module.power_choice_info(resref)["power"] == "PS1TSKN"
              )
              seer_proxy = next(
                  str(tables["pspick"].GetValue("PS1PREC", "ResRef")).upper()
                  for _ in (0,)
              )
              assert egoist_proxy in module.filter_spellinfo(1, [egoist_proxy, seer_proxy])
              assert seer_proxy not in module.filter_spellinfo(1, [egoist_proxy, seer_proxy])
              assert "PS1TSKN" not in known_refs()
              assert module.begin_manifest(1, egoist_proxy)
              assert "PS1TSKN" not in known_refs()
              assert module.begin_manifest(1, egoist_proxy)
              assert "PS1TSKN" in known_refs()
              assert module.power_choices_remaining(1) == 0
              assert not module.available_power_choices(1)
              assert not module.begin_manifest(1, module.POWER_SELECTOR_RESOURCE)
              assert module.sync_skill_points(1) == 24
          '''
          if insert_at not in text:
              raise SystemExit('runtime learning insertion marker missing')
          text = text.replace(insert_at, learning_test, 1)
          vr.write_text(text, encoding='utf-8')

          # Binary proxy generator: preserve SPL UI metadata but strip every effect.
          gen = psion / 'tools/generate_learning_proxies.py'
          gen.write_text(r'''#!/usr/bin/env python3
          """Build harmless PXL* selector proxies for Psion power learning."""
          from __future__ import annotations
          from pathlib import Path
          import argparse
          import shutil
          import struct
          
          
          def rows(path: Path):
              lines = path.read_text(encoding="utf-8").splitlines()
              if len(lines) < 3 or lines[0].strip().upper() != "2DA V1.0":
                  raise ValueError(f"not a 2DA table: {path}")
              result = []
              for line in lines[3:]:
                  stripped = line.strip()
                  if not stripped or stripped.startswith(("#", "//")):
                      continue
                  fields = stripped.split()
                  if len(fields) < 3:
                      raise ValueError(f"malformed PSPICK row: {line}")
                  result.append((fields[0].upper(), fields[1].upper()))
              return result
          
          
          def neutralize(source: bytes) -> bytes:
              data = bytearray(source)
              if len(data) < 0x72 or bytes(data[:8]) != b"SPL V1  ":
                  raise ValueError("expected an SPL V1 resource")
              header_offset = struct.unpack_from("<I", data, 0x64)[0]
              header_count = struct.unpack_from("<H", data, 0x68)[0]
              if header_count < 1 or header_offset + 0x28 > len(data):
                  raise ValueError("learning proxy source has no complete ability")
              # Keep the first ability solely for its icon, but make it an immediate
              # self-targeted, zero-effect action. Old headers/effects remain inert
              # trailing bytes because both live counts are reduced to one/zero.
              struct.pack_into("<H", data, 0x68, 1)
              struct.pack_into("<H", data, 0x6E, 0)
              struct.pack_into("<H", data, 0x70, 0)
              header = header_offset
              data[header + 0x02] = 4
              data[header + 0x0C] = 5
              data[header + 0x0D] = 0
              struct.pack_into("<H", data, header + 0x0E, 0x7FFF)
              struct.pack_into("<H", data, header + 0x10, 1)
              struct.pack_into("<I", data, header + 0x12, 0)
              struct.pack_into("<H", data, header + 0x1E, 0)
              struct.pack_into("<H", data, header + 0x20, 0)
              struct.pack_into("<H", data, header + 0x26, 1)
              return bytes(data)
          
          
          def build(override: Path, output: Path, pick: Path) -> int:
              shutil.rmtree(output, ignore_errors=True)
              output.mkdir(parents=True)
              seen = set()
              count = 0
              for power, proxy in rows(pick):
                  if proxy in seen:
                      raise ValueError(f"duplicate learning proxy: {proxy}")
                  seen.add(proxy)
                  source = override / f"{power}.SPL"
                  if not source.exists():
                      source = override / f"{power}.spl"
                  if not source.exists():
                      raise FileNotFoundError(f"missing Psion power {power}.SPL")
                  (output / f"{proxy}.spl").write_bytes(neutralize(source.read_bytes()))
                  count += 1
              return count
          
          
          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--override", type=Path, default=Path("override"))
              parser.add_argument("--output", type=Path, default=Path(".psion-learn-build"))
              parser.add_argument("--pick", type=Path, default=Path("psion/tables/pspick.2da"))
              parser.add_argument("--cleanup", action="store_true")
              args = parser.parse_args()
              if args.cleanup:
                  shutil.rmtree(args.output, ignore_errors=True)
                  return
              print(f"Generated {build(args.override, args.output, args.pick)} Psion learning proxies")
          
          
          if __name__ == "__main__":
              main()
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          # Focused static/binary regression for the new proxy generator.
          test = psion / 'tests/validate_power_learning.py'
          test.write_text(r'''#!/usr/bin/env python3
          from pathlib import Path
          import importlib.util
          import struct
          import tempfile
          
          ROOT = Path(__file__).resolve().parents[1]
          spec = importlib.util.spec_from_file_location("learnproxy", ROOT / "tools/generate_learning_proxies.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          
          
          def fake_spl():
              data = bytearray(0x72 + 0x28 + 0x30)
              data[:8] = b"SPL V1  "
              struct.pack_into("<I", data, 0x64, 0x72)
              struct.pack_into("<H", data, 0x68, 1)
              struct.pack_into("<I", data, 0x6A, 0x72 + 0x28)
              struct.pack_into("<H", data, 0x70, 1)
              data[0x72 + 0x04:0x72 + 0x0C] = b"SPWI112B"
              struct.pack_into("<H", data, 0x72 + 0x1E, 1)
              return bytes(data)
          
          
          def main():
              picks = mod.rows(ROOT / "tables/pspick.2da")
              assert len(picks) == 85
              assert len({proxy for _, proxy in picks}) == 85
              assert picks[0][1] == "PXL0001" and picks[-1][1] == "PXL0085"
              source = fake_spl()
              proxy = mod.neutralize(source)
              assert proxy[:0x64] == source[:0x64]
              assert struct.unpack_from("<H", proxy, 0x68)[0] == 1
              assert struct.unpack_from("<H", proxy, 0x70)[0] == 0
              header = struct.unpack_from("<I", proxy, 0x64)[0]
              assert proxy[header + 0x04:header + 0x0C] == b"SPWI112B"
              assert proxy[header + 0x0C] == 5
              assert struct.unpack_from("<H", proxy, header + 0x1E)[0] == 0
              with tempfile.TemporaryDirectory() as tmp:
                  base = Path(tmp)
                  override = base / "override"
                  output = base / "out"
                  override.mkdir()
                  (override / "PS1ERAY.spl").write_bytes(source)
                  pick = base / "pick.2da"
                  pick.write_text("2DA V1.0\n****\n        ResRef Type\nPS1ERAY PXL0001 3\n", encoding="utf-8")
                  assert mod.build(override, output, pick) == 1
                  assert (output / "PXL0001.spl").exists()
              print("Psion selectable-power proxy validation passed")
          
          
          if __name__ == "__main__":
              main()
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          validate = psion / 'tests/validate.py'
