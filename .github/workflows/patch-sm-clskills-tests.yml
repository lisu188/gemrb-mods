name: Patch SM CLSKILLS Tests

on:
  push:
    branches:
      - derive-sm-sorcerer-spell-metadata
    paths:
      - .github/workflows/patch-sm-clskills-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: derive-sm-sorcerer-spell-metadata
      - name: Update exact assertions and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('sorcerer-monk/tests/test_installer.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''        for row in clskills_rows:\n            self.assertIn("MXSPLSRC", row)\n            self.assertIn("SKILLS", row)\n            self.assertIn("CLABMO01", row)\n'''
          new = '''        for row in clskills_rows:\n            self.assertIn("%sm_magespell%", row)\n            self.assertIn("%sm_booktype%", row)\n            self.assertIn("SKILLS", row)\n            self.assertIn("CLABMO01", row)\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected test_installer spell assertion layout')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('sorcerer-monk/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '- Inherited `STARTXP` and `STARTXP2` values from the Sorcerer row.\n'
          addition = anchor + '- Inherited the live Sorcerer `MAGESPELL` table and `BOOKTYPE` in the combined `CLSKILLS.2DA` row, so chargen spell-level setup and spontaneous-book detection follow Sorcerer spell-system overrides instead of frozen `MXSPLSRC` / `2` literals.\n'
          if text.count(anchor) != 1:
              raise SystemExit('unexpected changelog anchor')
          changelog.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-sm-clskills-tests.yml
          git add sorcerer-monk/tests/test_installer.py sorcerer-monk/CHANGELOG.md
          git commit -m "Document live Sorcerer spell metadata"
          git push origin HEAD:derive-sm-sorcerer-spell-metadata
